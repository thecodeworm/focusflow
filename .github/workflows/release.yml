name: Release

# Push a tag like v1.0.1 to build installers and publish a GitHub Release.
# The tag sets the app version, and the release includes signed update
# bundles plus latest.json, which installed copies of Ringlet poll to update
# themselves. Running it manually builds the installers as workflow artifacts
# only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            build-args: --target universal-apple-darwin --bundles app,dmg
            built: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            asset: Ringlet-macOS-universal.dmg
            update-built: src-tauri/target/universal-apple-darwin/release/bundle/macos/Ringlet.app.tar.gz
            update-asset: Ringlet-macOS-universal.app.tar.gz
          - os: windows-latest
            rust-targets: ""
            build-args: --bundles nsis
            built: src-tauri/target/release/bundle/nsis/*-setup.exe
            asset: Ringlet-Windows-x64-setup.exe
            # On Windows the installer itself is the update package.
            update-built: src-tauri/target/release/bundle/nsis/*-setup.exe
            update-asset: Ringlet-Windows-x64-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Tag builds take their version from the tag (v1.2.3 -> 1.2.3) so
          # the updater always sees a higher version than what's installed.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            npx tauri build ${{ matrix.build-args }} --config "{\"version\":\"${GITHUB_REF_NAME#v}\"}"
          else
            npx tauri build ${{ matrix.build-args }}
          fi
      # Stable file names so the website can link to releases/latest/download/<asset>.
      - name: Collect release files
        shell: bash
        run: |
          mkdir -p out
          cp ${{ matrix.built }} "out/${{ matrix.asset }}"
          cp ${{ matrix.update-built }} "out/${{ matrix.update-asset }}"
          cp ${{ matrix.update-built }}.sig "out/${{ matrix.update-asset }}.sig"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Write latest.json
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          mac_sig=$(cat out/Ringlet-macOS-universal.app.tar.gz.sig)
          win_sig=$(cat out/Ringlet-Windows-x64-setup.exe.sig)
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_url "$base/Ringlet-macOS-universal.app.tar.gz" \
            --arg mac_sig "$mac_sig" \
            --arg win_url "$base/Ringlet-Windows-x64-setup.exe" \
            --arg win_sig "$win_sig" \
            '{
              version: $version,
              notes: "See the release page for what changed.",
              pub_date: $date,
              platforms: {
                "darwin-aarch64": { url: $mac_url, signature: $mac_sig },
                "darwin-x86_64":  { url: $mac_url, signature: $mac_sig },
                "windows-x86_64": { url: $win_url, signature: $win_sig }
              }
            }' > out/latest.json
          cat out/latest.json
          rm out/*.sig
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ringlet ${GITHUB_REF_NAME#v}" \
            --generate-notes
